name: Check redesign preview

on:
  push:
    branches:
      - redesign-editorial-creative-2026
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: editorial-redesign-preview
          path: dist/
          retention-days: 7
